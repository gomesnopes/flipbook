<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Kuis per Dimensi</title>
    
    <!-- Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SheetJS untuk Export Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Panggil file config kamu (pastikan variabel supabase tersedia secara global) -->
    <script src="configdash.js?V=2"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6 font-sans text-gray-800">

    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-lg p-6">
        <!-- Header & Tombol Download -->
        <div class="flex flex-col md:flex-row justify-between items-center border-b pb-4 mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Rekap Hasil Kuis</h1>
                <p class="text-sm text-gray-500">Menampilkan nilai per pertanyaan berdasarkan dimensi</p>
            </div>
            <button onclick="downloadExcel()" class="bg-green-600 hover:bg-green-700 transition-colors text-white font-semibold py-2 px-5 rounded-lg shadow-sm flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
                Download Excel
            </button>
        </div>

        <!-- Status Loading -->
        <div id="loading" class="text-center py-12">
            <svg class="animate-spin h-8 w-8 text-blue-600 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-gray-500 font-medium">Mengambil data dari database...</p>
        </div>

        <!-- Navigasi Tab Dimensi -->
        <div id="tabs-nav" class="flex space-x-1 border-b border-gray-200 mb-6 hidden overflow-x-auto"></div>

        <!-- Kontainer Tabel -->
        <div id="tabs-content" class="hidden"></div>
    </div>

    <script>
        // Objek utama untuk menyimpan data yang sudah dikelompokkan
        let dataDimensi = {}; 

        async function initData() {
            try {
                // Pastikan variabel client supabase sesuai dengan yang ada di config.js kamu
                // Jika config.js kamu menggunakan window.supabaseClient, ganti 'supabase' di bawah ini menjadi 'window.supabaseClient'
             // KODE BARU (YANG BENAR)
const { data, error } = await window.supabaseClient
    .from('view_rekap_kuis_lengkap')
    .select('*')
    .order('created_at', { ascending: true });

                if (error) throw error;
                
                prosesDataKeTabel(data);
            } catch (err) {
                console.error("Error:", err);
                document.getElementById('loading').innerHTML = `
                    <div class="bg-red-50 text-red-600 p-4 rounded-lg">
                        Gagal memuat data: ${err.message}. <br>
                        Pastikan config.js sudah benar dan koneksi internet stabil.
                    </div>`;
            }
        }

        function prosesDataKeTabel(rawData) {
            if (!rawData || rawData.length === 0) {
                document.getElementById('loading').innerHTML = "<p class='text-gray-500'>Tidak ada data kuis ditemukan.</p>";
                return;
            }

            // 1. Proses Pivot Data (Mengelompokkan berdasarkan Dimensi -> User -> Pertanyaan)
            rawData.forEach(row => {
                const dim = row.dimensi || 'Umum';
                
                if (!dataDimensi[dim]) {
                    dataDimensi[dim] = {
                        pertanyaan: new Set(),
                        users: {}
                    };
                }
                
                // Simpan pertanyaan unik sebagai kolom
                dataDimensi[dim].pertanyaan.add(row.pertanyaan);

                // Buat profil user di dalam dimensi ini jika belum ada
                if (!dataDimensi[dim].users[row.id_user]) {
                    dataDimensi[dim].users[row.id_user] = {
                        nama: row.nama_lengkap,
                        kota: row.kota || '-',
                        kategori: row.kategori || '-',
                        jawaban: {}, // Menyimpan skor per pertanyaan
                        totalSkor: 0
                    };
                }

                // Masukkan skor user untuk pertanyaan spesifik
                dataDimensi[dim].users[row.id_user].jawaban[row.pertanyaan] = row.skor;
                dataDimensi[dim].users[row.id_user].totalSkor += row.skor;
            });

            // 2. Render UI (Tab dan Tabel)
            document.getElementById('loading').classList.add('hidden');
            const tabsNav = document.getElementById('tabs-nav');
            const tabsContent = document.getElementById('tabs-content');
            
            tabsNav.classList.remove('hidden');
            tabsContent.classList.remove('hidden');

            let tabPertama = true;

            for (const dimensi in dataDimensi) {
                const dimData = dataDimensi[dimensi];
                const listPertanyaan = Array.from(dimData.pertanyaan);
                const idTab = 'tab-' + dimensi.replace(/[^a-zA-Z0-9]/g, ''); // Hapus spasi untuk ID HTML

                // --- Buat Tombol Tab ---
                const btn = document.createElement('button');
                btn.className = `px-5 py-2.5 text-sm font-medium rounded-t-lg transition-colors whitespace-nowrap focus:outline-none ${tabPertama ? 'bg-blue-600 text-white shadow-md' : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900'}`;
                btn.innerText = dimensi;
                btn.onclick = () => gantiTab(idTab, btn);
                tabsNav.appendChild(btn);

                // --- Buat Kontainer Tabel ---
                const divPanel = document.createElement('div');
                divPanel.id = idTab;
                divPanel.className = `tab-panel overflow-x-auto bg-white border border-gray-200 rounded-lg rounded-tl-none shadow-sm ${tabPertama ? '' : 'hidden'}`;

                // --- Bangun HTML Tabel ---
                let htmlTabel = `
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-50 whitespace-nowrap">
                            <tr>
                                <th class="px-4 py-3 border-b border-r bg-gray-100 sticky left-0 z-10 min-w-[150px]">Nama Lengkap</th>
                                <th class="px-4 py-3 border-b border-r bg-gray-50">Kota / Kategori</th>`;
                
                // Header Kolom Soal
                listPertanyaan.forEach((tanya, index) => {
                    // Teks soal dipotong sedikit agar tabel tidak terlalu panjang, tapi full saat dihover (title)
                    const teksPendek = tanya.length > 25 ? tanya.substring(0, 25) + '...' : tanya;
                    htmlTabel += `<th class="px-4 py-3 border-b text-center font-semibold" title="${tanya}">Soal ${index + 1}<br><span class="font-normal text-gray-500 capitalize">${teksPendek}</span></th>`;
                });

                htmlTabel += `  <th class="px-4 py-3 border-b border-l bg-blue-50 text-center sticky right-0">Total Skor</th>
                            </tr>
                        </thead>
                        <tbody>`;

                // Isi Data User
                Object.values(dimData.users).forEach(user => {
                    htmlTabel += `
                        <tr class="border-b hover:bg-blue-50/50 transition-colors">
                            <td class="px-4 py-3 border-r bg-white font-medium text-gray-900 sticky left-0 z-10">${user.nama}</td>
                            <td class="px-4 py-3 border-r text-gray-500 text-xs">${user.kota} <br> <span class="text-[10px] bg-gray-200 px-2 py-0.5 rounded">${user.kategori}</span></td>`;
                    
                    // Looping nilai tiap soal
                    listPertanyaan.forEach(tanya => {
                        const skor = user.jawaban[tanya] !== undefined ? user.jawaban[tanya] : '<span class="text-gray-300">-</span>';
                        htmlTabel += `<td class="px-4 py-3 text-center border-r border-gray-100">${skor}</td>`;
                    });

                    htmlTabel += `<td class="px-4 py-3 border-l bg-blue-50 text-center font-bold text-blue-700 sticky right-0">${user.totalSkor}</td>
                        </tr>`;
                });

                htmlTabel += `</tbody></table>`;
                divPanel.innerHTML = htmlTabel;
                tabsContent.appendChild(divPanel);

                tabPertama = false;
            }
        }

        function gantiTab(idTabAktif, tombolDiklik) {
            // Sembunyikan semua panel tabel
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.add('hidden'));
            document.getElementById(idTabAktif).classList.remove('hidden');

            // Reset warna semua tombol tab
            document.querySelectorAll('#tabs-nav button').forEach(btn => {
                btn.className = 'px-5 py-2.5 text-sm font-medium rounded-t-lg transition-colors whitespace-nowrap focus:outline-none text-gray-600 hover:bg-gray-100 hover:text-gray-900';
            });

            // Warnai tombol yang aktif
            tombolDiklik.className = 'px-5 py-2.5 text-sm font-medium rounded-t-lg transition-colors whitespace-nowrap focus:outline-none bg-blue-600 text-white shadow-md';
        }

        function downloadExcel() {
            if (Object.keys(dataDimensi).length === 0) {
                alert("Data kosong, tidak ada yang bisa didownload.");
                return;
            }

            const workbook = XLSX.utils.book_new();

            // Buat Sheet untuk tiap Dimensi
            for (const dimensi in dataDimensi) {
                const dimData = dataDimensi[dimensi];
                const listPertanyaan = Array.from(dimData.pertanyaan);
                const barisExcel = [];

                Object.values(dimData.users).forEach(user => {
                    // Struktur baris untuk Excel
                    let row = {
                        "Nama Lengkap": user.nama,
                        "Kota": user.kota,
                        "Kategori": user.kategori
                    };

                    // Kolom dinamis berdasarkan soal
                    listPertanyaan.forEach(tanya => {
                        row[tanya] = user.jawaban[tanya] !== undefined ? user.jawaban[tanya] : 0;
                    });

                    row["Total Skor"] = user.totalSkor;
                    barisExcel.push(row);
                });

                const worksheet = XLSX.utils.json_to_sheet(barisExcel);
                
                // Pastikan nama sheet aman untuk Excel (maks 31 karakter, hapus karakter ilegal)
                let namaSheet = dimensi.replace(/[\\\/\?\*\[\]\:]/g, '').substring(0, 31);
                
                XLSX.utils.book_append_sheet(workbook, worksheet, namaSheet);
            }

            // Simpan file
            XLSX.writeFile(workbook, "Laporan_Kuis_Per_Dimensi.xlsx");
        }

        // Jalankan saat web pertama kali dimuat
        window.onload = initData;
    </script>
</body>
</html>
