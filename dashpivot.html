<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Kuis - Tab Navigasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="configdash.js?v=6"></script> 
    <style>
        .sticky-col-left { position: sticky; left: 0; z-index: 20; }
        .sticky-col-right { position: sticky; right: 0; z-index: 20; }
        /* Kustomisasi scrollbar agar lebih rapi di tab mendatar */
        .custom-scrollbar::-webkit-scrollbar { height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-6 font-sans text-gray-800">

    <div class="max-w-[1400px] mx-auto bg-white rounded-xl shadow-lg p-4 md:p-6">
        
        <!-- Header & Judul -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-4 mb-4 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800 mb-1">Rekap Hasil Kuis</h1>
                <p class="text-sm text-gray-500">Pilih modul/buku di bawah untuk melihat hasil per dimensi.</p>
            </div>

            <!-- Tombol Download (2 Pilihan) -->
            <div class="flex space-x-2 w-full md:w-auto">
                <button onclick="downloadExcel('aktif')" class="flex-1 md:flex-none bg-indigo-600 hover:bg-indigo-700 transition-colors text-white text-sm font-semibold py-2 px-4 rounded-lg shadow-sm flex items-center justify-center gap-2" title="Download sheet yang sedang dibuka saja">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                    Unduh Tab Aktif
                </button>
                <button onclick="downloadExcel('semua')" class="flex-1 md:flex-none bg-green-600 hover:bg-green-700 transition-colors text-white text-sm font-semibold py-2 px-4 rounded-lg shadow-sm flex items-center justify-center gap-2" title="Download semua sheet dalam 1 file">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z" /></svg>
                    Unduh Semua
                </button>
            </div>
        </div>

        <!-- TABS PILIHAN BUKU / MODUL -->
        <div id="book-tabs" class="flex space-x-2 overflow-x-auto pb-3 mb-4 custom-scrollbar">
            <span class="text-gray-400 italic text-sm py-2">Memuat daftar modul...</span>
        </div>

        <div id="loading" class="text-center py-12 hidden">
            <svg class="animate-spin h-8 w-8 text-blue-600 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <p class="text-gray-500 font-medium" id="teks-loading">Mengambil data...</p>
        </div>

        <div id="pesan-awal" class="text-center py-12 text-gray-500 bg-gray-50 rounded-lg border border-dashed border-gray-300">
            Silakan pilih Modul / Buku pada tab di atas untuk menampilkan data rekapitulasi.
        </div>

        <!-- TABS DIMENSI SOAL (Pre, Post, dll) -->
        <div id="tabs-nav" class="flex space-x-1 border-b border-gray-200 mb-6 hidden overflow-x-auto custom-scrollbar"></div>
        <div id="tabs-content" class="hidden"></div>
    </div>

    <script>
        let dataTabs = {}; 
        let mapProfilUser = {};
        
        // Variabel global untuk mode Download Excel
        let currentBukuTitle = '';
        let currentTabName = ''; 

        // 1. Ambil dan Render Tab Buku
        async function loadDaftarBuku() {
            try {
                const { data, error } = await window.supabaseClient.from('buku').select('*').order('created_at', { ascending: false }); 
                if (error) throw error;

                const bookTabsContainer = document.getElementById('book-tabs');
                bookTabsContainer.innerHTML = '';

                if(data.length === 0) {
                    bookTabsContainer.innerHTML = '<span class="text-red-500 text-sm py-2">Belum ada modul/buku di database.</span>';
                    return;
                }

                data.forEach(buku => {
                    const judul = buku.judul_buku || buku.judul || buku.nama || buku.nama_buku || ('Buku ' + buku.id);
                    
                    const btn = document.createElement('button');
                    btn.className = 'book-tab-btn px-4 py-2 text-sm font-medium border border-gray-300 rounded-full whitespace-nowrap bg-white text-gray-700 hover:bg-gray-100 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500';
                    btn.innerText = judul;
                    
                    btn.onclick = () => {
                        // Ubah warna tombol yang aktif
                        document.querySelectorAll('.book-tab-btn').forEach(b => {
                            b.classList.remove('bg-blue-600', 'text-white', 'border-blue-600', 'hover:bg-blue-700');
                            b.classList.add('bg-white', 'text-gray-700', 'hover:bg-gray-100');
                        });
                        btn.classList.remove('bg-white', 'text-gray-700', 'hover:bg-gray-100');
                        btn.classList.add('bg-blue-600', 'text-white', 'border-blue-600', 'hover:bg-blue-700');
                        
                        currentBukuTitle = judul;
                        loadDataKuis(buku.id);
                    };
                    
                    bookTabsContainer.appendChild(btn);
                });
            } catch (err) {
                console.error("Gagal memuat buku:", err);
                document.getElementById('book-tabs').innerHTML = '<span class="text-red-500 text-sm py-2">Gagal memuat daftar buku, periksa koneksi.</span>';
            }
        }

        // Fungsi Hitung Umur
        function hitungUmur(tanggalLahir) {
            if (!tanggalLahir) return '-';
            const today = new Date();
            const birthDate = new Date(tanggalLahir);
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return age;
        }

        // Format Jenis Kelamin (L/P)
        function formatGender(jk) {
            if (!jk) return '-';
            const j = jk.toLowerCase();
            if (j.includes('laki')) return 'L';
            if (j.includes('perempuan') || j.includes('wanita')) return 'P';
            return '-';
        }

        // 2. Load Data Kuis saat Tab Buku diklik
        async function loadDataKuis(idBuku) {
            const tabsNav = document.getElementById('tabs-nav');
            const tabsContent = document.getElementById('tabs-content');
            const loading = document.getElementById('loading');
            const teksLoading = document.getElementById('teks-loading');
            
            document.getElementById('pesan-awal').classList.add('hidden');
            tabsNav.classList.add('hidden');
            tabsContent.classList.add('hidden');
            
            loading.classList.remove('hidden');
            dataTabs = {}; 
            mapProfilUser = {};
            currentTabName = ''; // Reset tab aktif

            try {
                // A. Master Soal
                teksLoading.innerText = "Mengambil daftar soal...";
                const { data: masterSoal, error: errKuis } = await window.supabaseClient
                    .from('kuis')
                    .select('id, pertanyaan, dimensi, opsi_jawaban')
                    .eq('id_buku', idBuku);
                if (errKuis) throw errKuis;

                if (!masterSoal || masterSoal.length === 0) {
                    loading.innerHTML = "<p class='text-gray-500 py-10'>Belum ada soal/pertanyaan yang dibuat untuk modul ini.</p>";
                    return;
                }

                const kamusSoal = {};
                masterSoal.forEach(soal => {
                    kamusSoal[soal.id] = soal;
                    
                    let dimAsli = soal.dimensi || 'Umum';
                    let namaTab = dimAsli;
                    let subDimensi = dimAsli;

                    if (dimAsli.toLowerCase().startsWith('pre_')) {
                        namaTab = 'Pre Test';
                        subDimensi = dimAsli.substring(4) || 'Lainnya'; 
                    } else if (dimAsli.toLowerCase().startsWith('post_')) {
                        namaTab = 'Post Test';
                        subDimensi = dimAsli.substring(5) || 'Lainnya'; 
                    }

                    if (!dataTabs[namaTab]) dataTabs[namaTab] = { subDims: {}, users: {} };
                    if (!dataTabs[namaTab].subDims[subDimensi]) dataTabs[namaTab].subDims[subDimensi] = new Set();
                    dataTabs[namaTab].subDims[subDimensi].add(soal.pertanyaan);
                });

                // B. Riwayat Jawaban User
                teksLoading.innerText = "Mengambil jawaban peserta...";
                const { data: riwayatData, error: errRiwayat } = await window.supabaseClient
                    .from('riwayat_kuis')
                    .select('id_user, detail_jawaban')
                    .eq('id_buku', idBuku);
                if (errRiwayat) throw errRiwayat;

                // C. Profil User (Include JK dan Tanggal Lahir)
                if (riwayatData && riwayatData.length > 0) {
                    teksLoading.innerText = "Menyesuaikan data profil peserta...";
                    const userIds = [...new Set(riwayatData.map(r => r.id_user))];
                    
                    const { data: profilData, error: errProfil } = await window.supabaseClient
                        .from('profiles')
                        .select('id, nama_lengkap, kota, kategori, jenis_kelamin, tanggal_lahir')
                        .in('id', userIds);
                    if (errProfil) throw errProfil;

                    profilData.forEach(p => { mapProfilUser[p.id] = p; });
                }

                // D. Gabungkan Data
                if (riwayatData && riwayatData.length > 0) {
                    riwayatData.forEach(riwayat => {
                        const userProfil = mapProfilUser[riwayat.id_user] || {};
                        const JSONJawaban = riwayat.detail_jawaban || {}; 

                        const nama = userProfil.nama_lengkap || 'User Tidak Diketahui';
                        const kota = userProfil.kota || '-';
                        const kategori = userProfil.kategori || '-';
                        const umur = hitungUmur(userProfil.tanggal_lahir);
                        const jk = formatGender(userProfil.jenis_kelamin);

                        for (const idSoalString in JSONJawaban) {
                            const pilihanHuruf = JSONJawaban[idSoalString];
                            const referensiSoal = kamusSoal[idSoalString]; 

                            if (referensiSoal) {
                                let dimAsli = referensiSoal.dimensi || 'Umum';
                                let namaTab = dimAsli;
                                
                                if (dimAsli.toLowerCase().startsWith('pre_')) namaTab = 'Pre Test';
                                else if (dimAsli.toLowerCase().startsWith('post_')) namaTab = 'Post Test';

                                if (!dataTabs[namaTab].users[riwayat.id_user]) {
                                    dataTabs[namaTab].users[riwayat.id_user] = {
                                        nama: nama,
                                        umur: umur,
                                        jk: jk,
                                        kota: kota,
                                        kategori: kategori,
                                        jawaban: {}, 
                                        totalSkor: 0
                                    };
                                }

                                let poin = 0;
                                if (referensiSoal.opsi_jawaban && referensiSoal.opsi_jawaban[pilihanHuruf]) {
                                    poin = parseInt(referensiSoal.opsi_jawaban[pilihanHuruf].poin) || 0;
                                }

                                dataTabs[namaTab].users[riwayat.id_user].jawaban[referensiSoal.pertanyaan] = poin;
                                dataTabs[namaTab].users[riwayat.id_user].totalSkor += poin;
                            }
                        }
                    });
                }

                renderUI();

            } catch (err) {
                console.error("Error:", err);
                loading.innerHTML = `<div class="bg-red-50 text-red-600 p-4 rounded-lg">Gagal memuat data: ${err.message}</div>`;
            }
        }

        function renderUI() {
            const loading = document.getElementById('loading');
            const tabsNav = document.getElementById('tabs-nav');
            const tabsContent = document.getElementById('tabs-content');
            
            loading.classList.add('hidden');
            tabsNav.classList.remove('hidden');
            tabsContent.classList.remove('hidden');

            tabsNav.innerHTML = '';
            tabsContent.innerHTML = '';

            let tabPertama = true;

            for (const namaTab in dataTabs) {
                const tabData = dataTabs[namaTab];
                const idTab = 'tab-' + namaTab.replace(/[^a-zA-Z0-9]/g, ''); 

                // Buat Tombol Tab Dimensi
                const btn = document.createElement('button');
                btn.className = `dimensi-tab-btn px-5 py-2.5 text-sm font-medium rounded-t-lg transition-colors whitespace-nowrap focus:outline-none ${tabPertama ? 'bg-indigo-50 text-indigo-700 border-b-2 border-indigo-600' : 'text-gray-600 hover:bg-gray-50'}`;
                btn.innerText = namaTab;
                btn.onclick = () => gantiTab(idTab, btn, namaTab);
                tabsNav.appendChild(btn);

                // Set Tab Aktif Pertama secara global
                if(tabPertama) currentTabName = namaTab;

                // Buat Tabel
                const divPanel = document.createElement('div');
                divPanel.id = idTab;
                divPanel.className = `dimensi-panel overflow-x-auto bg-white border border-gray-200 rounded-lg rounded-tl-none shadow-sm ${tabPertama ? '' : 'hidden'}`;

                // Header Tabel
                let htmlTabel = `<table class="w-full text-sm text-left"><thead class="text-xs text-gray-700 bg-gray-50 whitespace-nowrap">`;
                
                let headerBaris1 = `<tr>
                    <th rowspan="2" class="px-4 py-3 border bg-gray-100 sticky-col-left min-w-[150px] uppercase">Nama Lengkap</th>
                    <th rowspan="2" class="px-2 py-3 border bg-gray-50 uppercase text-center">Umur</th>
                    <th rowspan="2" class="px-2 py-3 border bg-gray-50 uppercase text-center">L/P</th>
                    <th rowspan="2" class="px-3 py-3 border bg-gray-50 uppercase">Kota / Kategori</th>`;
                
                let headerBaris2 = `<tr>`;

                let semuaSoalTerurut = []; 

                for (const [subDim, setPertanyaan] of Object.entries(tabData.subDims)) {
                    const arrTanya = Array.from(setPertanyaan);
                    semuaSoalTerurut = semuaSoalTerurut.concat(arrTanya);
                    
                    headerBaris1 += `<th colspan="${arrTanya.length}" class="px-4 py-2 border text-center font-bold bg-indigo-100 text-indigo-800 uppercase tracking-wide">${subDim}</th>`;

                    arrTanya.forEach((tanya, index) => {
                        const teksPendek = tanya.length > 20 ? tanya.substring(0, 20) + '...' : tanya;
                        headerBaris2 += `<th class="px-3 py-2 border text-center font-semibold bg-white" title="${tanya}">Q${index + 1}<br><span class="font-normal text-gray-500 capitalize text-[10px]">${teksPendek}</span></th>`;
                    });
                }

                headerBaris1 += `<th rowspan="2" class="px-4 py-3 border bg-blue-50 text-center sticky-col-right uppercase">Total Skor</th></tr>`;
                headerBaris2 += `</tr>`;
                
                htmlTabel += headerBaris1 + headerBaris2 + `</thead><tbody>`;

                // Isi Data User
                const users = Object.values(tabData.users);

                if (users.length === 0) {
                    htmlTabel += `<tr><td colspan="${semuaSoalTerurut.length + 5}" class="text-center py-8 text-gray-500 bg-gray-50 italic">Belum ada user yang menjawab kuis di kategori ini</td></tr>`;
                } else {
                    users.forEach(user => {
                        htmlTabel += `
                            <tr class="border-b hover:bg-blue-50/50 transition-colors">
                                <td class="px-4 py-3 border-r bg-white font-medium text-gray-900 sticky-col-left">${user.nama}</td>
                                <td class="px-2 py-3 border-r text-center text-gray-600">${user.umur}</td>
                                <td class="px-2 py-3 border-r text-center text-gray-600 font-semibold">${user.jk}</td>
                                <td class="px-3 py-3 border-r text-gray-500 text-xs">${user.kota} <br> <span class="text-[10px] bg-gray-200 px-2 py-0.5 rounded">${user.kategori}</span></td>`;
                        
                        semuaSoalTerurut.forEach(tanya => {
                            const skor = user.jawaban[tanya] !== undefined ? user.jawaban[tanya] : '<span class="text-gray-300">-</span>';
                            htmlTabel += `<td class="px-3 py-2 text-center border-r border-gray-100">${skor}</td>`;
                        });

                        htmlTabel += `<td class="px-4 py-3 border-l bg-blue-50 text-center font-bold text-blue-700 sticky-col-right">${user.totalSkor}</td></tr>`;
                    });
                }

                htmlTabel += `</tbody></table>`;
                divPanel.innerHTML = htmlTabel;
                tabsContent.appendChild(divPanel);

                tabPertama = false;
            }
        }

        // Fungsi klik tab dimensi
        function gantiTab(idTabAktif, tombolDiklik, namaTabStr) {
            currentTabName = namaTabStr; // Simpan status tab saat ini
            
            document.querySelectorAll('.dimensi-panel').forEach(panel => panel.classList.add('hidden'));
            document.getElementById(idTabAktif).classList.remove('hidden');

            document.querySelectorAll('.dimensi-tab-btn').forEach(btn => {
                btn.className = 'dimensi-tab-btn px-5 py-2.5 text-sm font-medium rounded-t-lg transition-colors whitespace-nowrap focus:outline-none text-gray-600 hover:bg-gray-50';
            });
            tombolDiklik.className = 'dimensi-tab-btn px-5 py-2.5 text-sm font-medium rounded-t-lg transition-colors whitespace-nowrap focus:outline-none bg-indigo-50 text-indigo-700 border-b-2 border-indigo-600';
        }

        // 3. Download Excel (Mode 'aktif' atau 'semua')
        function downloadExcel(mode) {
            if (!currentBukuTitle || Object.keys(dataTabs).length === 0) {
                alert("Pilih buku dan pastikan data tersedia sebelum mengunduh.");
                return;
            }

            const workbook = XLSX.utils.book_new();
            let adaDataTersimpan = false;

            for (const namaTab in dataTabs) {
                // Jika mode aktif, lewati tab yang sedang tidak dibuka
                if (mode === 'aktif' && namaTab !== currentTabName) continue;

                const tabData = dataTabs[namaTab];
                const users = Object.values(tabData.users);

                if (users.length === 0) continue; 
                adaDataTersimpan = true;

                let kolomExcel = []; 
                for (const [subDim, setPertanyaan] of Object.entries(tabData.subDims)) {
                    Array.from(setPertanyaan).forEach(tanya => {
                        kolomExcel.push({ dimensi: subDim, soalAsli: tanya });
                    });
                }

                const barisExcel = [];
                users.forEach(user => {
                    let row = {
                        "Nama Lengkap": user.nama,
                        "Umur": user.umur,
                        "L/P": user.jk,
                        "Kota": user.kota,
                        "Kategori": user.kategori
                    };

                    kolomExcel.forEach(item => {
                        let namaKolom = (namaTab === 'Pre Test' || namaTab === 'Post Test') 
                            ? `[${item.dimensi}] ${item.soalAsli}` 
                            : item.soalAsli;
                            
                        row[namaKolom] = user.jawaban[item.soalAsli] !== undefined ? user.jawaban[item.soalAsli] : 0;
                    });

                    row["Total Skor"] = user.totalSkor;
                    barisExcel.push(row);
                });

                const worksheet = XLSX.utils.json_to_sheet(barisExcel);
                let namaSheet = namaTab.replace(/[\\\/\?\*\[\]\:]/g, '').substring(0, 31);
                XLSX.utils.book_append_sheet(workbook, worksheet, namaSheet);
            }
            
            if (!adaDataTersimpan) {
                alert("Tidak ada data hasil kuis pada pilihan ini untuk diunduh.");
                return;
            }

            // Bersihkan nama modul untuk judul file
            let judulFile = currentBukuTitle.replace(/[^a-zA-Z0-9 -]/g, "").substring(0, 20);
            let namaFileAkhir = mode === 'aktif' 
                ? `Rekap_${judulFile}_${currentTabName.replace(/ /g, '')}.xlsx`
                : `Rekap_${judulFile}_SemuaTab.xlsx`;

            XLSX.writeFile(workbook, namaFileAkhir);
        }

        window.onload = loadDaftarBuku;
    </script>
</body>
</html>
