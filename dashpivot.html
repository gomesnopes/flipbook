<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Kuis - Grup Pre & Post Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="configdash.js?v=5"></script> 
    <style>
        /* Agar tabel tidak berantakan saat discroll */
        .sticky-col-left { position: sticky; left: 0; z-index: 20; }
        .sticky-col-right { position: sticky; right: 0; z-index: 20; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-6 font-sans text-gray-800">

    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-lg p-6">
        
        <!-- Header & Filter Buku -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-4 mb-6 gap-4">
            <div class="w-full md:w-1/2">
                <h1 class="text-2xl font-bold text-gray-800 mb-2">Rekap Hasil Kuis</h1>
                <select id="filterBuku" onchange="loadDataKuis()" class="w-full p-2 border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">-- Memuat daftar modul/buku... --</option>
                </select>
            </div>

            <button onclick="downloadExcel()" class="bg-green-600 hover:bg-green-700 transition-colors text-white font-semibold py-2 px-5 rounded-lg shadow-sm flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
                Download Excel
            </button>
        </div>

        <div id="loading" class="text-center py-12 hidden">
            <svg class="animate-spin h-8 w-8 text-blue-600 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-gray-500 font-medium" id="teks-loading">Mengambil data...</p>
        </div>

        <div id="pesan-awal" class="text-center py-12 text-gray-500">
            Silakan pilih Modul / Buku pada dropdown di atas untuk menampilkan data.
        </div>

        <div id="tabs-nav" class="flex space-x-1 border-b border-gray-200 mb-6 hidden overflow-x-auto"></div>
        <div id="tabs-content" class="hidden"></div>
    </div>

    <script>
        // Struktur data: { "Pre Test": { subDims: { "Verbal": [soal1, soal2] }, users: { "id": { nama, jawaban, totalSkor } } } }
        let dataTabs = {}; 
        let mapProfilUser = {};

        // 1. Ambil daftar buku (Perbaikan agar tidak gagal muat)
        async function loadDaftarBuku() {
            try {
                // Ambil semua kolom agar kita bisa menebak mana yang judul
                const { data, error } = await window.supabaseClient.from('buku').select('*'); 
                if (error) throw error;

                const selectBuku = document.getElementById('filterBuku');
                selectBuku.innerHTML = '<option value="">-- Pilih Modul / Buku --</option>';

                data.forEach(buku => {
                    const opt = document.createElement('option');
                    opt.value = buku.id;
                    // Tebak otomatis nama kolom judulnya
                    const judul = buku.judul_buku || buku.judul || buku.nama || buku.nama_buku || buku.title || ('Buku ' + buku.id);
                    opt.textContent = judul;
                    selectBuku.appendChild(opt);
                });
            } catch (err) {
                console.error("Gagal memuat buku:", err);
                document.getElementById('filterBuku').innerHTML = '<option value="">Gagal memuat daftar buku, periksa koneksi/RLS</option>';
            }
        }

        // 2. Load Data Kuis
        async function loadDataKuis() {
            const idBuku = document.getElementById('filterBuku').value;
            const tabsNav = document.getElementById('tabs-nav');
            const tabsContent = document.getElementById('tabs-content');
            const loading = document.getElementById('loading');
            const teksLoading = document.getElementById('teks-loading');
            
            document.getElementById('pesan-awal').classList.add('hidden');
            tabsNav.classList.add('hidden');
            tabsContent.classList.add('hidden');
            
            if (!idBuku) {
                document.getElementById('pesan-awal').classList.remove('hidden');
                return;
            }

            loading.classList.remove('hidden');
            dataTabs = {}; 
            mapProfilUser = {};

            try {
                // A. Master Soal
                teksLoading.innerText = "Mengambil daftar soal...";
                const { data: masterSoal, error: errKuis } = await window.supabaseClient
                    .from('kuis')
                    .select('id, pertanyaan, dimensi, opsi_jawaban')
                    .eq('id_buku', idBuku);
                if (errKuis) throw errKuis;

                if (!masterSoal || masterSoal.length === 0) {
                    loading.innerHTML = "<p class='text-gray-500 py-10'>Belum ada soal/pertanyaan yang dibuat untuk buku ini.</p>";
                    return;
                }

                const kamusSoal = {};
                masterSoal.forEach(soal => {
                    kamusSoal[soal.id] = soal;
                    
                    // Logika Pemisahan Tab (Pre, Post, Lainnya)
                    let dimAsli = soal.dimensi || 'Umum';
                    let namaTab = dimAsli;
                    let subDimensi = dimAsli;

                    if (dimAsli.toLowerCase().startsWith('pre_')) {
                        namaTab = 'Pre Test';
                        subDimensi = dimAsli.substring(4) || 'Lainnya'; // Potong 4 huruf awal
                    } else if (dimAsli.toLowerCase().startsWith('post_')) {
                        namaTab = 'Post Test';
                        subDimensi = dimAsli.substring(5) || 'Lainnya'; // Potong 5 huruf awal
                    }

                    if (!dataTabs[namaTab]) {
                        dataTabs[namaTab] = { subDims: {}, users: {} };
                    }
                    if (!dataTabs[namaTab].subDims[subDimensi]) {
                        dataTabs[namaTab].subDims[subDimensi] = new Set();
                    }
                    
                    dataTabs[namaTab].subDims[subDimensi].add(soal.pertanyaan);
                });

                // B. Riwayat Jawaban User
                teksLoading.innerText = "Mengambil jawaban peserta...";
                const { data: riwayatData, error: errRiwayat } = await window.supabaseClient
                    .from('riwayat_kuis')
                    .select('id_user, detail_jawaban')
                    .eq('id_buku', idBuku);
                if (errRiwayat) throw errRiwayat;

                // C. Profil User
                if (riwayatData && riwayatData.length > 0) {
                    teksLoading.innerText = "Menyesuaikan data profil peserta...";
                    const userIds = [...new Set(riwayatData.map(r => r.id_user))];
                    
                    const { data: profilData, error: errProfil } = await window.supabaseClient
                        .from('profiles')
                        .select('id, nama_lengkap, kota, kategori')
                        .in('id', userIds);
                    if (errProfil) throw errProfil;

                    profilData.forEach(p => { mapProfilUser[p.id] = p; });
                }

                // D. Gabungkan Data (Pengecekan Nilai)
                if (riwayatData && riwayatData.length > 0) {
                    riwayatData.forEach(riwayat => {
                        const userProfil = mapProfilUser[riwayat.id_user] || { nama_lengkap: 'User Tidak Diketahui', kota: '-', kategori: '-' };
                        const JSONJawaban = riwayat.detail_jawaban || {}; 

                        for (const idSoalString in JSONJawaban) {
                            const pilihanHuruf = JSONJawaban[idSoalString];
                            const referensiSoal = kamusSoal[idSoalString]; 

                            if (referensiSoal) {
                                let dimAsli = referensiSoal.dimensi || 'Umum';
                                let namaTab = dimAsli;
                                
                                if (dimAsli.toLowerCase().startsWith('pre_')) namaTab = 'Pre Test';
                                else if (dimAsli.toLowerCase().startsWith('post_')) namaTab = 'Post Test';

                                // Siapkan wadah user
                                if (!dataTabs[namaTab].users[riwayat.id_user]) {
                                    dataTabs[namaTab].users[riwayat.id_user] = {
                                        nama: userProfil.nama_lengkap,
                                        kota: userProfil.kota || '-',
                                        kategori: userProfil.kategori || '-',
                                        jawaban: {}, 
                                        totalSkor: 0
                                    };
                                }

                                let poin = 0;
                                if (referensiSoal.opsi_jawaban && referensiSoal.opsi_jawaban[pilihanHuruf]) {
                                    poin = parseInt(referensiSoal.opsi_jawaban[pilihanHuruf].poin) || 0;
                                }

                                dataTabs[namaTab].users[riwayat.id_user].jawaban[referensiSoal.pertanyaan] = poin;
                                dataTabs[namaTab].users[riwayat.id_user].totalSkor += poin;
                            }
                        }
                    });
                }

                renderUI();

            } catch (err) {
                console.error("Error:", err);
                loading.innerHTML = `<div class="bg-red-50 text-red-600 p-4 rounded-lg">Gagal memuat data: ${err.message}</div>`;
            }
        }

        function renderUI() {
            const loading = document.getElementById('loading');
            const tabsNav = document.getElementById('tabs-nav');
            const tabsContent = document.getElementById('tabs-content');
            
            loading.classList.add('hidden');
            tabsNav.classList.remove('hidden');
            tabsContent.classList.remove('hidden');

            tabsNav.innerHTML = '';
            tabsContent.innerHTML = '';

            let tabPertama = true;

            for (const namaTab in dataTabs) {
                const tabData = dataTabs[namaTab];
                const idTab = 'tab-' + namaTab.replace(/[^a-zA-Z0-9]/g, ''); 

                // --- TOMBOL TAB ---
                const btn = document.createElement('button');
                btn.className = `px-5 py-2.5 text-sm font-medium rounded-t-lg transition-colors whitespace-nowrap focus:outline-none ${tabPertama ? 'bg-blue-600 text-white shadow-md' : 'text-gray-600 hover:bg-gray-100'}`;
                btn.innerText = namaTab;
                btn.onclick = () => gantiTab(idTab, btn);
                tabsNav.appendChild(btn);

                // --- TABEL PANEL ---
                const divPanel = document.createElement('div');
                divPanel.id = idTab;
                divPanel.className = `tab-panel overflow-x-auto bg-white border border-gray-200 rounded-lg rounded-tl-none shadow-sm ${tabPertama ? '' : 'hidden'}`;

                // --- HEADER TABEL (2 TINGKAT) ---
                let htmlTabel = `<table class="w-full text-sm text-left"><thead class="text-xs text-gray-700 bg-gray-50 whitespace-nowrap">`;
                
                // Baris Atas Header (Nama, Sub-Dimensi, Total)
                let headerBaris1 = `<tr>
                    <th rowspan="2" class="px-4 py-3 border bg-gray-100 sticky-col-left min-w-[180px] uppercase">Nama Lengkap</th>
                    <th rowspan="2" class="px-4 py-3 border bg-gray-50 uppercase">Kota / Kategori</th>`;
                
                // Baris Bawah Header (Daftar Soal)
                let headerBaris2 = `<tr>`;

                // Loop setiap Sub-Dimensi untuk Header
                let semuaSoalTerurut = []; // Untuk memudahkan pengisian baris user nanti

                for (const [subDim, setPertanyaan] of Object.entries(tabData.subDims)) {
                    const arrTanya = Array.from(setPertanyaan);
                    semuaSoalTerurut = semuaSoalTerurut.concat(arrTanya);
                    
                    // Colspan selebar jumlah soal di sub-dimensi ini
                    headerBaris1 += `<th colspan="${arrTanya.length}" class="px-4 py-2 border text-center font-bold bg-blue-100 text-blue-800 uppercase tracking-wide">${subDim}</th>`;

                    // Print soal-soalnya di baris kedua
                    arrTanya.forEach((tanya, index) => {
                        const teksPendek = tanya.length > 25 ? tanya.substring(0, 25) + '...' : tanya;
                        headerBaris2 += `<th class="px-3 py-2 border text-center font-semibold bg-white" title="${tanya}">Q${index + 1}<br><span class="font-normal text-gray-500 capitalize text-[10px]">${teksPendek}</span></th>`;
                    });
                }

                headerBaris1 += `<th rowspan="2" class="px-4 py-3 border bg-blue-50 text-center sticky-col-right uppercase">Total Skor</th></tr>`;
                headerBaris2 += `</tr>`;
                
                htmlTabel += headerBaris1 + headerBaris2 + `</thead><tbody>`;

                // --- ISI DATA USER ---
                const users = Object.values(tabData.users);

                if (users.length === 0) {
                    htmlTabel += `<tr><td colspan="${semuaSoalTerurut.length + 3}" class="text-center py-8 text-gray-500 bg-gray-50 italic">Belum ada user yang menjawab kuis di kategori ini</td></tr>`;
                } else {
                    users.forEach(user => {
                        htmlTabel += `
                            <tr class="border-b hover:bg-blue-50/50 transition-colors">
                                <td class="px-4 py-3 border-r bg-white font-medium text-gray-900 sticky-col-left">${user.nama}</td>
                                <td class="px-4 py-3 border-r text-gray-500 text-xs">${user.kota} <br> <span class="text-[10px] bg-gray-200 px-2 py-0.5 rounded">${user.kategori}</span></td>`;
                        
                        // Isi skor mengikuti urutan soal
                        semuaSoalTerurut.forEach(tanya => {
                            const skor = user.jawaban[tanya] !== undefined ? user.jawaban[tanya] : '<span class="text-gray-300">-</span>';
                            htmlTabel += `<td class="px-3 py-2 text-center border-r border-gray-100">${skor}</td>`;
                        });

                        htmlTabel += `<td class="px-4 py-3 border-l bg-blue-50 text-center font-bold text-blue-700 sticky-col-right">${user.totalSkor}</td></tr>`;
                    });
                }

                htmlTabel += `</tbody></table>`;
                divPanel.innerHTML = htmlTabel;
                tabsContent.appendChild(divPanel);

                tabPertama = false;
            }
        }

        function gantiTab(idTabAktif, tombolDiklik) {
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.add('hidden'));
            document.getElementById(idTabAktif).classList.remove('hidden');

            document.querySelectorAll('#tabs-nav button').forEach(btn => {
                btn.className = 'px-5 py-2.5 text-sm font-medium rounded-t-lg transition-colors whitespace-nowrap focus:outline-none text-gray-600 hover:bg-gray-100';
            });
            tombolDiklik.className = 'px-5 py-2.5 text-sm font-medium rounded-t-lg transition-colors whitespace-nowrap focus:outline-none bg-blue-600 text-white shadow-md';
        }

        // 3. Download Excel (Penamaan Kolom Disesuaikan)
        function downloadExcel() {
            if (Object.keys(dataTabs).length === 0) {
                alert("Data kosong, tidak ada yang bisa didownload.");
                return;
            }

            const workbook = XLSX.utils.book_new();

            for (const namaTab in dataTabs) {
                const tabData = dataTabs[namaTab];
                const barisExcel = [];
                const users = Object.values(tabData.users);

                if (users.length === 0) continue; 

                // Siapkan daftar soal beserta nama sub-dimensinya untuk header Excel
                let kolomExcel = []; 
                for (const [subDim, setPertanyaan] of Object.entries(tabData.subDims)) {
                    Array.from(setPertanyaan).forEach(tanya => {
                        // Format kolom excel: [Verbal] Soal...
                        kolomExcel.push({ dimensi: subDim, soalAsli: tanya });
                    });
                }

                users.forEach(user => {
                    let row = {
                        "Nama Lengkap": user.nama,
                        "Kota": user.kota,
                        "Kategori": user.kategori
                    };

                    kolomExcel.forEach(item => {
                        // Buat nama kolom Excel yang informatif
                        let namaKolom = namaTab === 'Pre Test' || namaTab === 'Post Test' 
                            ? `[${item.dimensi}] ${item.soalAsli}` 
                            : item.soalAsli;
                            
                        row[namaKolom] = user.jawaban[item.soalAsli] !== undefined ? user.jawaban[item.soalAsli] : 0;
                    });

                    row["Total Skor"] = user.totalSkor;
                    barisExcel.push(row);
                });

                const worksheet = XLSX.utils.json_to_sheet(barisExcel);
                let namaSheet = namaTab.replace(/[\\\/\?\*\[\]\:]/g, '').substring(0, 31);
                XLSX.utils.book_append_sheet(workbook, worksheet, namaSheet);
            }
            
            const selectBuku = document.getElementById('filterBuku');
            const judulBuku = selectBuku.options[selectBuku.selectedIndex].text.replace(/[^a-zA-Z0-9 ]/g, "").substring(0, 20);
            
            XLSX.writeFile(workbook, `Rekap_Kuis_${judulBuku}.xlsx`);
        }

        window.onload = loadDaftarBuku;
    </script>
</body>
</html>
