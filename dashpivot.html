<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Kuis per Dimensi (Optimasi Client-Side)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Tambahkan versi baru agar tidak kena cache browser -->
    <script src="configdash.js?v=4"></script> 
</head>
<body class="bg-gray-100 min-h-screen p-6 font-sans text-gray-800">

    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-lg p-6">
        
        <!-- Header & Filter Buku -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-4 mb-6 gap-4">
            <div class="w-full md:w-1/2">
                <h1 class="text-2xl font-bold text-gray-800 mb-2">Rekap Hasil Kuis</h1>
                <select id="filterBuku" onchange="loadDataKuis()" class="w-full p-2 border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">-- Memuat daftar modul/buku... --</option>
                </select>
            </div>

            <button onclick="downloadExcel()" class="bg-green-600 hover:bg-green-700 transition-colors text-white font-semibold py-2 px-5 rounded-lg shadow-sm flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
                Download Excel
            </button>
        </div>

        <!-- Status Loading -->
        <div id="loading" class="text-center py-12 hidden">
            <svg class="animate-spin h-8 w-8 text-blue-600 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-gray-500 font-medium" id="teks-loading">Mengambil data...</p>
        </div>

        <div id="pesan-awal" class="text-center py-12 text-gray-500">
            Silakan pilih Modul / Buku pada dropdown di atas untuk menampilkan data.
        </div>

        <!-- Navigasi Tab Dimensi -->
        <div id="tabs-nav" class="flex space-x-1 border-b border-gray-200 mb-6 hidden overflow-x-auto"></div>

        <!-- Kontainer Tabel -->
        <div id="tabs-content" class="hidden"></div>
    </div>

    <script>
        let dataDimensi = {}; 
        let mapProfilUser = {}; // Menyimpan data profil user sementara

        // 1. Ambil daftar buku
        async function loadDaftarBuku() {
            try {
                const { data, error } = await window.supabaseClient
                    .from('buku')
                    .select('id, judul_buku'); 
                    
                if (error) throw error;

                const selectBuku = document.getElementById('filterBuku');
                selectBuku.innerHTML = '<option value="">-- Pilih Modul / Buku --</option>';

                data.forEach(buku => {
                    const opt = document.createElement('option');
                    opt.value = buku.id;
                    opt.textContent = buku.judul_buku || 'Buku Tanpa Judul';
                    selectBuku.appendChild(opt);
                });
            } catch (err) {
                console.error("Gagal memuat buku:", err);
                document.getElementById('filterBuku').innerHTML = '<option value="">Gagal memuat daftar buku</option>';
            }
        }

        // 2. Logika Utama Pengambilan dan Pemrosesan Data Mentah
        async function loadDataKuis() {
            const idBuku = document.getElementById('filterBuku').value;
            
            const tabsNav = document.getElementById('tabs-nav');
            const tabsContent = document.getElementById('tabs-content');
            const loading = document.getElementById('loading');
            const teksLoading = document.getElementById('teks-loading');
            
            document.getElementById('pesan-awal').classList.add('hidden');
            tabsNav.classList.add('hidden');
            tabsContent.classList.add('hidden');
            
            if (!idBuku) {
                document.getElementById('pesan-awal').classList.remove('hidden');
                return;
            }

            loading.classList.remove('hidden');
            dataDimensi = {}; 
            mapProfilUser = {};

            try {
                // A. TAHAP 1: Ambil Master Soal (Untuk mengetahui dimensi, pertanyaan, dan bobot nilai)
                teksLoading.innerText = "Mengambil daftar soal...";
                const { data: masterSoal, error: errKuis } = await window.supabaseClient
                    .from('kuis')
                    .select('id, pertanyaan, dimensi, opsi_jawaban')
                    .eq('id_buku', idBuku);
                if (errKuis) throw errKuis;

                if (!masterSoal || masterSoal.length === 0) {
                    loading.innerHTML = "<p class='text-gray-500 py-10'>Belum ada soal/pertanyaan yang dibuat untuk buku ini.</p>";
                    return;
                }

                // Buat kamus/dictionary soal agar Javascript mudah mencari referensi nilainya
                const kamusSoal = {};
                masterSoal.forEach(soal => {
                    kamusSoal[soal.id] = soal;
                    
                    // Siapkan struktur tab per dimensi
                    const dim = soal.dimensi || 'Umum';
                    if (!dataDimensi[dim]) {
                        dataDimensi[dim] = { pertanyaan: new Set(), users: {} };
                    }
                    dataDimensi[dim].pertanyaan.add(soal.pertanyaan);
                });

                // B. TAHAP 2: Ambil Riwayat Jawaban (Raw JSON)
                teksLoading.innerText = "Mengambil jawaban peserta...";
                const { data: riwayatData, error: errRiwayat } = await window.supabaseClient
                    .from('riwayat_kuis')
                    .select('id_user, detail_jawaban')
                    .eq('id_buku', idBuku);
                if (errRiwayat) throw errRiwayat;

                // C. TAHAP 3: Ambil Profil User (Hanya yang mengerjakan kuis ini saja)
                if (riwayatData && riwayatData.length > 0) {
                    teksLoading.innerText = "Menyesuaikan data profil peserta...";
                    // Kumpulkan ID unik
                    const userIds = [...new Set(riwayatData.map(r => r.id_user))];
                    
                    const { data: profilData, error: errProfil } = await window.supabaseClient
                        .from('profiles')
                        .select('id, nama_lengkap, kota, kategori')
                        .in('id', userIds);
                    if (errProfil) throw errProfil;

                    // Buat map/kamus profil
                    profilData.forEach(p => {
                        mapProfilUser[p.id] = p;
                    });
                }

                // D. TAHAP 4: Ekstraksi Data (Membongkar JSON di Javascript)
                if (riwayatData && riwayatData.length > 0) {
                    riwayatData.forEach(riwayat => {
                        const userProfil = mapProfilUser[riwayat.id_user] || { nama_lengkap: 'User Tidak Diketahui', kota: '-', kategori: '-' };
                        const JSONJawaban = riwayat.detail_jawaban || {}; // Berisi misal: {"414": "D", "415": "A"}

                        // Looping setiap jawaban di dalam JSON user
                        for (const idSoalString in JSONJawaban) {
                            const pilihanHuruf = JSONJawaban[idSoalString];
                            const referensiSoal = kamusSoal[idSoalString]; // Ambil data soal asli

                            if (referensiSoal) {
                                const dim = referensiSoal.dimensi || 'Umum';
                                
                                // Buat template user jika belum ada di dimensi ini
                                if (!dataDimensi[dim].users[riwayat.id_user]) {
                                    dataDimensi[dim].users[riwayat.id_user] = {
                                        nama: userProfil.nama_lengkap,
                                        kota: userProfil.kota || '-',
                                        kategori: userProfil.kategori || '-',
                                        jawaban: {}, 
                                        totalSkor: 0
                                    };
                                }

                                // Ekstrak nilai berdasarkan opsi jawaban json (contoh: kuis.opsi_jawaban."A".poin)
                                // Jika tidak ada, poin defaultnya 0
                                let poin = 0;
                                if (referensiSoal.opsi_jawaban && referensiSoal.opsi_jawaban[pilihanHuruf]) {
                                    poin = parseInt(referensiSoal.opsi_jawaban[pilihanHuruf].poin) || 0;
                                }

                                dataDimensi[dim].users[riwayat.id_user].jawaban[referensiSoal.pertanyaan] = poin;
                                dataDimensi[dim].users[riwayat.id_user].totalSkor += poin;
                            }
                        }
                    });
                }

                renderUI();

            } catch (err) {
                console.error("Error:", err);
                loading.innerHTML = `<div class="bg-red-50 text-red-600 p-4 rounded-lg">Gagal memuat data: ${err.message}</div>`;
            }
        }

        function renderUI() {
            const loading = document.getElementById('loading');
            const tabsNav = document.getElementById('tabs-nav');
            const tabsContent = document.getElementById('tabs-content');
            
            loading.classList.add('hidden');
            tabsNav.classList.remove('hidden');
            tabsContent.classList.remove('hidden');

            tabsNav.innerHTML = '';
            tabsContent.innerHTML = '';

            let tabPertama = true;

            for (const dimensi in dataDimensi) {
                const dimData = dataDimensi[dimensi];
                const listPertanyaan = Array.from(dimData.pertanyaan);
                const idTab = 'tab-' + dimensi.replace(/[^a-zA-Z0-9]/g, ''); 

                // Buat Tombol Tab
                const btn = document.createElement('button');
                btn.className = `px-5 py-2.5 text-sm font-medium rounded-t-lg transition-colors whitespace-nowrap focus:outline-none ${tabPertama ? 'bg-blue-600 text-white shadow-md' : 'text-gray-600 hover:bg-gray-100'}`;
                btn.innerText = dimensi;
                btn.onclick = () => gantiTab(idTab, btn);
                tabsNav.appendChild(btn);

                // Buat Tabel
                const divPanel = document.createElement('div');
                divPanel.id = idTab;
                divPanel.className = `tab-panel overflow-x-auto bg-white border border-gray-200 rounded-lg rounded-tl-none shadow-sm ${tabPertama ? '' : 'hidden'}`;

                let htmlTabel = `
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-50 whitespace-nowrap">
                            <tr>
                                <th class="px-4 py-3 border-b border-r bg-gray-100 sticky left-0 z-10 min-w-[150px]">Nama Lengkap</th>
                                <th class="px-4 py-3 border-b border-r bg-gray-50">Kota / Kategori</th>`;
                
                listPertanyaan.forEach((tanya, index) => {
                    const teksPendek = tanya.length > 25 ? tanya.substring(0, 25) + '...' : tanya;
                    htmlTabel += `<th class="px-4 py-3 border-b text-center font-semibold" title="${tanya}">Soal ${index + 1}<br><span class="font-normal text-gray-500 capitalize">${teksPendek}</span></th>`;
                });

                htmlTabel += `<th class="px-4 py-3 border-b border-l bg-blue-50 text-center sticky right-0">Total Skor</th></tr></thead><tbody>`;

                const users = Object.values(dimData.users);

                if (users.length === 0) {
                    htmlTabel += `<tr><td colspan="${listPertanyaan.length + 3}" class="text-center py-6 text-gray-500 bg-gray-50">Belum ada user yang menjawab kuis di dimensi ini</td></tr>`;
                } else {
                    users.forEach(user => {
                        htmlTabel += `
                            <tr class="border-b hover:bg-blue-50/50 transition-colors">
                                <td class="px-4 py-3 border-r bg-white font-medium text-gray-900 sticky left-0 z-10">${user.nama}</td>
                                <td class="px-4 py-3 border-r text-gray-500 text-xs">${user.kota} <br> <span class="text-[10px] bg-gray-200 px-2 py-0.5 rounded">${user.kategori}</span></td>`;
                        
                        listPertanyaan.forEach(tanya => {
                            const skor = user.jawaban[tanya] !== undefined ? user.jawaban[tanya] : '<span class="text-gray-300">-</span>';
                            htmlTabel += `<td class="px-4 py-3 text-center border-r border-gray-100">${skor}</td>`;
                        });

                        htmlTabel += `<td class="px-4 py-3 border-l bg-blue-50 text-center font-bold text-blue-700 sticky right-0">${user.totalSkor}</td></tr>`;
                    });
                }

                htmlTabel += `</tbody></table>`;
                divPanel.innerHTML = htmlTabel;
                tabsContent.appendChild(divPanel);

                tabPertama = false;
            }
        }

        function gantiTab(idTabAktif, tombolDiklik) {
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.add('hidden'));
            document.getElementById(idTabAktif).classList.remove('hidden');

            document.querySelectorAll('#tabs-nav button').forEach(btn => {
                btn.className = 'px-5 py-2.5 text-sm font-medium rounded-t-lg transition-colors whitespace-nowrap focus:outline-none text-gray-600 hover:bg-gray-100';
            });
            tombolDiklik.className = 'px-5 py-2.5 text-sm font-medium rounded-t-lg transition-colors whitespace-nowrap focus:outline-none bg-blue-600 text-white shadow-md';
        }

        function downloadExcel() {
            if (Object.keys(dataDimensi).length === 0) {
                alert("Data kosong, tidak ada yang bisa didownload.");
                return;
            }

            const workbook = XLSX.utils.book_new();

            for (const dimensi in dataDimensi) {
                const dimData = dataDimensi[dimensi];
                const listPertanyaan = Array.from(dimData.pertanyaan);
                const barisExcel = [];
                const users = Object.values(dimData.users);

                if (users.length === 0) continue; 

                users.forEach(user => {
                    let row = {
                        "Nama Lengkap": user.nama,
                        "Kota": user.kota,
                        "Kategori": user.kategori
                    };

                    listPertanyaan.forEach(tanya => {
                        row[tanya] = user.jawaban[tanya] !== undefined ? user.jawaban[tanya] : 0;
                    });

                    row["Total Skor"] = user.totalSkor;
                    barisExcel.push(row);
                });

                const worksheet = XLSX.utils.json_to_sheet(barisExcel);
                let namaSheet = dimensi.replace(/[\\\/\?\*\[\]\:]/g, '').substring(0, 31);
                XLSX.utils.book_append_sheet(workbook, worksheet, namaSheet);
            }
            
            const selectBuku = document.getElementById('filterBuku');
            const judulBuku = selectBuku.options[selectBuku.selectedIndex].text.replace(/[^a-zA-Z0-9 ]/g, "").substring(0, 20);
            
            XLSX.writeFile(workbook, `Rekap_Kuis_${judulBuku}.xlsx`);
        }

        window.onload = loadDaftarBuku;
    </script>
</body>
</html>
